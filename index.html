<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Coach Sportif</title>
<meta name="description" content="Lecteur de séance d'entraînement, utilisable hors ligne.">
<meta name="theme-color" content="#ECEEE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar"><div class="bar-in">
  <button class="brand" data-act="goto" data-i="overview" aria-label="Retour au plan de séance">Coach Sportif</button>
  <button class="sync" id="sync" data-act="goto" data-i="settings" aria-label="État de la synchronisation"><i></i><span></span></button>
  <div class="chrono" id="chrono" aria-label="Durée de la séance">0:00</div>
</div></header>

<div class="banner" id="banner" hidden><span>Nouvelle version de l'app disponible.</span><button data-act="reload">Recharger</button></div>

<main class="wrap" id="app">
  <div class="empty"><div class="eyebrow">Chargement</div><p>Ouverture de l'app…</p></div>
</main>

<div class="sheet" id="sheet" hidden><div class="sheet-in">
  <div class="sh-top"><span id="shLabel">Repos</span><span id="shNext"></span></div>
  <div class="sh-time" id="shTime" role="timer">0:00</div>
  <div class="sh-track"><i id="shBar"></i></div>
  <div class="sh-btns">
    <button data-act="t-minus" id="shMinus">−15 s</button>
    <button data-act="t-plus" id="shPlus">+15 s</button>
    <button class="primary" data-act="t-stop" id="shStop">Passer</button>
  </div>
</div></div>

<script src="app.js" defer></script>
</body>
</html>
